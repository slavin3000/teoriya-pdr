<title>ПДР-тренажёр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centred column (max 760px) — home = modes + stats, quiz = ticket strip + question card. Road-sign blue accent, lane-marking yellow for attention. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f5f7f9;
  --line: #d5dce3;
  --ink: #15202b;
  --ink-2: #4a5866;
  --ink-3: #7a8794;
  --accent: #1c5dab;
  --accent-ink: #ffffff;
  --accent-soft: #e2ecf8;
  --marking: #e8a900;
  --marking-soft: #fdf3d6;
  --ok: #1d8049;
  --ok-soft: #e1f3e8;
  --bad: #c4302a;
  --bad-soft: #fbe5e3;
  --shadow: 0 1px 2px rgba(21, 32, 43, .06), 0 4px 16px rgba(21, 32, 43, .06);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111519; --surface: #1a2026; --surface-2: #20272e; --line: #2e3842;
    --ink: #e7ecf0; --ink-2: #aab6c1; --ink-3: #7d8a96;
    --accent: #5d9be4; --accent-ink: #0c1620; --accent-soft: #1b2c40;
    --marking: #f2c230; --marking-soft: #3a3016;
    --ok: #45c07c; --ok-soft: #16301f; --bad: #f0645a; --bad-soft: #3a1c1a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111519; --surface: #1a2026; --surface-2: #20272e; --line: #2e3842;
  --ink: #e7ecf0; --ink-2: #aab6c1; --ink-3: #7d8a96;
  --accent: #5d9be4; --accent-ink: #0c1620; --accent-soft: #1b2c40;
  --marking: #f2c230; --marking-soft: #3a3016;
  --ok: #45c07c; --ok-soft: #16301f; --bad: #f0645a; --bad-soft: #3a1c1a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
button { font: inherit; color: inherit; }
.app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 20px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-sign { width: 38px; height: 38px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: 0; flex: none; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 20px; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--ink-3); font-size: 13px; }
.save-state { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.save-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; }
.save-state.on i { background: var(--ok); }
.save-state.warn i { background: var(--marking); }
.lane { height: 4px; background: repeating-linear-gradient(90deg, var(--marking) 0 28px, transparent 28px 44px); border-radius: 2px; opacity: .85; }

h2.sec { font-family: var(--f-display); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 0 0 10px; }

/* modes */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.mode { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px 18px 16px; display: grid; gap: 6px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease; min-width: 0; }
.mode:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--accent); }
.mode:disabled { cursor: default; opacity: .75; box-shadow: none; }
.mode-kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.mode-fix .mode-kicker { color: var(--bad); }
.mode-real .mode-kicker { color: var(--ink-2); }
.mode-real { background: var(--surface-2); }
.mode-title { font-family: var(--f-display); font-weight: 700; font-size: 18px; line-height: 1.3; text-wrap: balance; }
.mode-sub { color: var(--ink-2); font-size: 14px; }
.mode-go { margin-top: 6px; font-weight: 600; font-size: 14px; color: var(--accent); }

/* stats */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 620px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.tile b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 12.5px; color: var(--ink-3); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; }
.empty { color: var(--ink-3); font-size: 14px; margin: 0; }
.weak-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 44px; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.weak-row:first-child { border-top: 0; }
.weak-row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.weak-row .nm small { color: var(--ink-3); font-family: var(--f-mono); font-size: 12px; margin-right: 6px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--bad); border-radius: 3px; }
.bar i.mid { background: var(--marking); }
.bar i.good { background: var(--ok); }
.pct { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.hist-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.hist-row:first-child { border-top: 0; }
.hist-row .when { color: var(--ink-2); min-width: 0; }
.hist-row .err { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.mute { background: var(--surface-2); color: var(--ink-3); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.two > * { min-width: 0; }

/* quiz */
.qbar { display: flex; align-items: center; gap: 12px; justify-content: space-between; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--ink-2); }
.ghost:hover { border-color: var(--ink-3); color: var(--ink); }
.ghost.danger { border-color: var(--bad); color: var(--bad); }
.qbar-mid { font-weight: 600; font-size: 14px; color: var(--ink-2); text-align: center; flex: 1; min-width: 0; }
.qbar-mid .errs { color: var(--bad); }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; padding: 4px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.timer.low { background: var(--marking-soft); border-color: var(--marking); }
.strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; }
.strip li { list-style: none; min-width: 0; }
.cell { display: block; width: 100%; padding: 7px 0; background: none; border: 0; cursor: pointer; }
.cell::before { content: ""; display: block; height: 8px; border-radius: 2px; background: var(--line); transition: transform .1s ease; }
.cell.ok::before { background: var(--ok); }
.cell.bad::before { background: var(--bad); }
.cell.cur::before { background: var(--accent); }
.cell.viewing::before { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
.cell:not(.locked):hover::before { transform: scaleY(1.6); }
.cell.locked { cursor: default; }
.cell.open::before { background: var(--line); }
.cell:focus-visible { outline: none; }
.cell:focus-visible::before { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--marking); }
.tip { position: fixed; z-index: 50; max-width: min(340px, calc(100vw - 24px)); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 11px; font-size: 13px; line-height: 1.4; box-shadow: var(--shadow); pointer-events: none; }
.tip b { display: block; font-family: var(--f-mono); font-size: 12px; font-weight: 600; margin-bottom: 3px; }
.tip b span { font-family: var(--f-body); font-weight: 600; margin-left: 6px; }
.tip .t-ok { color: var(--ok-soft); } .tip .t-bad { color: var(--bad-soft); } .tip .t-cur { color: var(--accent-soft); }
.tip p { margin: 0; }
.review-bar { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 14px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) { .cell::before { transition: none; } }
.progress-line { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.progress-line i { display: block; height: 100%; background: var(--accent); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 14px; box-shadow: var(--shadow); min-width: 0; }
.qmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
.chip { font-family: var(--f-mono); font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); padding: 2px 8px; border-radius: 6px; }
.qimg { margin: 0; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.qimg img { display: block; width: 100%; height: 100%; object-fit: contain; }
.qtext { font-size: 19px; line-height: 1.45; font-weight: 600; margin: 0; text-wrap: pretty; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: start; text-align: left; background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer; font-size: 16px; line-height: 1.45; transition: border-color .1s ease, background .1s ease; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt:disabled { cursor: default; }
.opt .num { width: 30px; height: 30px; border-radius: 7px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 14px; }
.opt .mark { font-size: 13px; font-weight: 600; align-self: center; white-space: nowrap; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .num { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.right .mark { color: var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .num { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt.wrong .mark { color: var(--bad); }
.opt.dim { opacity: .55; }
.feedback { border-radius: 10px; padding: 12px 14px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.feedback.ok { background: var(--ok-soft); color: var(--ok); }
.feedback.bad { background: var(--bad-soft); color: var(--bad); }
.feedback span { font-weight: 500; color: var(--ink); }
.explain { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 15px; white-space: pre-wrap; }
.explain .note { display: block; margin-top: 8px; font-size: 12.5px; color: var(--ink-3); white-space: normal; }
.actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 600; cursor: pointer; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.soft { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); }
.btn.soft:hover { border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: default; }
.kbd { font-size: 12px; color: var(--ink-3); text-align: right; }

/* result */
.verdict { border-radius: 14px; padding: 22px 20px; display: grid; gap: 6px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.verdict .big { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.15; }
.verdict.pass .big { color: var(--ok); }
.verdict.fail .big { color: var(--bad); }
.verdict p { margin: 0; color: var(--ink-2); }
.mist { display: grid; gap: 10px; }
.mist-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; font-size: 14.5px; min-width: 0; }
.mist-item .q { font-weight: 600; }
.mist-item .a-bad { color: var(--bad); }
.mist-item .a-ok { color: var(--ok); }
.mist-item img { max-width: min(100%, 360px); border-radius: 6px; display: block; }
.row-actions { display: flex; gap: 10px; flex-wrap: wrap; }
:focus-visible { outline: 2.5px solid var(--marking); outline-offset: 2px; }
.skeleton { background: linear-gradient(90deg, var(--surface-2), var(--line), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skeleton { animation: none; } .mode { transition: none; } }
.foot { font-size: 12.5px; color: var(--ink-3); text-align: center; }
#view { display: grid; gap: 16px; min-width: 0; }

/* ПДР quotes */
.explain { white-space: normal; display: grid; gap: 12px; }
.law { display: grid; gap: 10px; }
.law-src { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.law-item { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.law-item figcaption { font-family: var(--f-mono); font-size: 12.5px; font-weight: 600; color: var(--accent); }
.law-item blockquote { margin: 0; font-size: 14.5px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
.law-item blockquote.clamp { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.law-more { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; cursor: pointer; }
.law-none { margin: 0; font-size: 14px; color: var(--ink-2); }
.why-text { white-space: pre-wrap; font-size: 15px; }

/* always-visible progress */
.progress { display: grid; gap: 8px; }
.pg-nums { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: baseline; }
.pg-nums > div { display: flex; align-items: baseline; gap: 6px; }
.pg-nums b { font-family: var(--f-display); font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.pg-nums .pg-main b { font-size: 22px; color: var(--ok); }
.pg-nums span { font-size: 13px; color: var(--ink-3); }
.pg-nums .pg-wait b { color: var(--bad); }
.pg-nums .pg-fc b { color: var(--accent); }
.pg-nums .pg-fc { cursor: help; }
.pg-bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; display: flex; }
.pg-bar i { display: block; height: 100%; }
.pg-bar i.ok { background: var(--ok); }
.pg-bar i.wait { background: var(--bad); }
.chip.rep { background: var(--bad-soft); color: var(--bad); font-family: var(--f-body); }

/* sign cards */
.sign-item { margin: 0; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--bad); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.sign-item figcaption { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.sign-num { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--bad); }
.sign-name { font-weight: 600; font-size: 14.5px; }
.sign-item blockquote { margin: 0; font-size: 14.5px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
.sign-item blockquote.clamp { max-height: 8em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.sign-notes { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.sign-hint { font-size: 12.5px; color: var(--ink-3); }
/* pause / resume */
.resume { border: 1.5px solid var(--marking); background: var(--marking-soft); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 14px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.resume-text { display: grid; gap: 3px; min-width: 0; }
.resume-text b { font-size: 16px; font-variant-numeric: tabular-nums; }
.resume-sub { font-size: 13px; color: var(--ink-2); }
.resume .mode-kicker { color: var(--ink-2); }
.verdict.paused .big { color: var(--ink); }
.verdict.paused { border-color: var(--marking); }
.mode-go.warn { color: var(--bad); }
.btn.danger, .btn.soft.danger { border-color: var(--bad); color: var(--bad); }
.qbar { flex-wrap: wrap; }
.qbar-left { display: flex; gap: 8px; }
@media (max-width: 540px) { .qbar-mid { order: 3; flex-basis: 100%; text-align: left; } }

</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-sign" aria-hidden="true">ПДР</div>
      <div>
        <h1>ПДР-тренажёр</h1>
        <p>Разделы 1–39 и дополнительные для категорий B1, B · 1762 вопроса</p>
      </div>
    </div>
    <div class="save-state" id="save-state"><i></i><span>Подключаю статистику…</span></div>
  </header>
  <section class="progress" id="progress" aria-label="Прогресс подготовки"></section>
  <div class="lane" aria-hidden="true"></div>
  <main id="view" aria-live="polite"></main>
  <p class="foot">Ответы — по таблице правильных ответов, утверждённой приказом ГСЦ МВС от 29.10.2025 № 225.</p>
</div>

<script type="application/json" id="qdata">__DATA__</script>
<script>
(() => {
  "use strict";
  // ---------- data ----------
  const RAW = JSON.parse(document.getElementById("qdata").textContent);
  const SECT = new Map(RAW.sections.map(s => [s.id, s]));
  const Q = RAW.q.map(a => ({ id: a[0], s: a[1], n: a[2], t: a[3], o: a[4], c: a[5], p: a[6], r: a[7], w: a[8] }));
  const BY = new Map(Q.map(q => [q.id, q]));
  const EXAM_N = 20, EXAM_SEC = 20 * 60, EXAM_MAX_ERR = 2, FIX_NEED = 2;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pad = (n, l = 2) => String(n).padStart(l, "0");
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  const fmtTime = s => { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); };
  const fmtDate = ts => { const d = new Date(ts); return pad(d.getDate()) + "." + pad(d.getMonth() + 1) + "." + d.getFullYear() + ", " + pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  function plural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few; return many; }

  // ---------- images (packed JSON files, loaded on demand) ----------
  const packCache = new Map();
  function loadPack(p) {
    if (p < 0) return Promise.resolve(null);
    if (!packCache.has(p)) {
      const pr = fetch("packs/p" + pad(p, 3) + ".json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
      pr.catch(() => packCache.delete(p));
      packCache.set(p, pr);
    }

  const STOP = new Set(["якщо", "який", "яким", "якій", "якого", "якої", "яких", "інших", "іншим", "цьому", "цього", "цієї", "даній", "даному", "даної", "повинен", "повинні", "може", "можуть", "дозволено", "дозволяється", "заборонено", "водій", "водію", "водієві", "водія", "транс", "засоб", "засобу", "засобів", "засобами", "правил", "правилами", "також", "тільки", "лише", "разі", "умови", "наведених", "зазначені", "пунктах", "відповіді", "відповідь", "ситуації", "випадку", "випадках", "після", "перед", "через", "якому", "їхнього", "свого", "своєї", "усіх", "всіх", "будь", "того", "тому", "того", "чином", "метою", "вимоги", "вимог"]);
  function toks(text) {
    return (String(text).toLowerCase().replace(/[’'ʼ`]/g, "").match(/[a-zа-яіїєґ]+|\d{1,2}(?:\.\d{1,2})+/g) || [])
      .filter(w => /^\d/.test(w) || (w.length >= 4 && !STOP.has(w)))
      .map(w => /^\d/.test(w) ? w : w.slice(0, 6));
  }
  function loadPdr() {
    if (!pdrPromise) {
      pdrPromise = fetch("pdr.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(P => {
        const chunks = P.chunks.map(([k, sec, label, text]) => ({ k, sec, label, text }));
        const df = new Map();
        for (const c of chunks) {
          const tf = new Map(); for (const t of toks(c.label + " " + c.text)) tf.set(t, (tf.get(t) || 0) + 1);
          let len = 0; tf.forEach(v => { len += v; }); c.tf = tf; c.len = len;
          tf.forEach((_, t) => df.set(t, (df.get(t) || 0) + 1));
        }
        const avg = chunks.reduce((a, c) => a + c.len, 0) / chunks.length;
        return { edition: P.edition, chunks, df, N: chunks.length, avg, byKey: new Map(chunks.map(c => [c.k, c])), alias: P.alias || {}, names: P.names || {}, notes: P.notes || {}, order: P.order || { "33": [], "34": [] } };
      });
      pdrPromise.catch(() => { pdrPromise = null; });
    }
    return pdrPromise;
  }
  const pdrSecs = s => (s === "8.1" || s === "8.2") ? ["8"] : (s === "16.1" || s === "16.2") ? ["16"] : (+s >= 1 && +s <= 34 ? [s] : []);
  function pdrGet(I, key) { return I.byKey.get(key) || I.byKey.get(I.alias[key]) || null; }
  function explicitRefs(I, text) {
    const out = [], re = /(знак\w*|розмітк\w*|табличк\w*|пункт\w*|п\.)\s*((?:\d{1,2}\.\d{1,2}(?:\.\d{1,2})?(?:\s*(?:,|і|та|або|-|–)\s*)?)+)/gi;
    let m;
    while ((m = re.exec(text))) {
      const w = m[1].toLowerCase(); const ns = w.startsWith("знак") || w.startsWith("табличк") ? "33:" : w.startsWith("розмітк") ? "34:" : "";
      for (const n of m[2].match(/\d{1,2}\.\d{1,2}(?:\.\d{1,2})?/g) || []) { const c = pdrGet(I, ns + n); if (c && !out.includes(c)) out.push(c); }
    }
    return out;
  }
  function pdrCandidates(I, q) {
    const w = new Map();
    const add = (text, k) => { for (const t of toks(text)) w.set(t, Math.max(w.get(t) || 0, k)); };
    q.o.forEach((t, i) => add(t, i + 1 === q.c ? 1.5 : 0.3)); add(q.t, 1);
    const secs = pdrSecs(q.s), scored = [];
    for (const c of I.chunks) {
      let s = 0;
      w.forEach((wt, t) => { const f = c.tf.get(t); if (!f) return; const df = I.df.get(t); const idf = Math.log(1 + (I.N - df + 0.5) / (df + 0.5)); s += wt * idf * (f * 2.2) / (f + 1.2 * (0.25 + 0.75 * c.len / I.avg)); });
      if (s > 0) scored.push([secs.includes(c.sec) ? s * 1.4 : s, c]);
    }
    scored.sort((a, b) => b[0] - a[0]);
    const top = explicitRefs(I, q.t + " " + q.o.join(" "));
    for (const [, c] of scored) { if (top.length >= 12) break; if (!top.includes(c)) top.push(c); }
    const toc = I.chunks.filter(c => secs.includes(c.sec) && !top.includes(c));
    return { top, toc };
  }
  const clip = (s, n) => s.length > n ? s.slice(0, n) + "…" : s;

  // ---------- "Почему?" via Claude ----------
  let samplePromise = null;
  function getSample() { if (!samplePromise) samplePromise = (window.claude && typeof window.claude.use === "function") ? window.claude.use("sample").catch(() => null) : Promise.resolve(null); return samplePromise; }
  const whyCache = new Map();
  let whyOff = false;
  const HIDE_CODES = ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"];
  // one card per sign / marking seen in the picture: number, name, meaning from ПДР and the general provisions that name it
  function objCards(I, objs) {
    if (!objs.length) return "";
    const signs = objs.filter(o => o.ns === "33"), marks = objs.filter(o => o.ns === "34");
    const card = (o, i) => {
      const long = o.def.length > 600;
      const notes = o.notes.slice(0, 3), more = o.notes.length - notes.length;
      return `<figure class="sign-item"><figcaption><span class="sign-num">${o.ns === "33" ? "знак" : "розмітка"} ${esc(o.num)}</span>${o.name ? ` <span class="sign-name">«${esc(o.name)}»</span>` : ""}</figcaption>
        <blockquote lang="uk" class="${long ? "clamp" : ""}" id="obj-${i}">${esc(o.def)}</blockquote>${long ? `<button class="law-more" data-t="obj-${i}">Показать полностью</button>` : ""}
        ${notes.length ? `<ul class="sign-notes" lang="uk">${notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>${more > 0 ? `<button class="law-more sign-more" data-more="${i}">Ещё ${more} ${plural(more, "положение", "положения", "положений")}</button>` : ""}` : ""}
      </figure>`;
    };
    let i = 0;
    return (signs.length ? `<div class="law-src">Знаки на картинке</div>${signs.map(o => card(o, i++)).join("")}` : "")
      + (marks.length ? `<div class="law-src">Разметка на картинке</div>${marks.map(o => card(o, i++)).join("")}` : "")
      + `<p class="law-none sign-hint">Знаки и разметка распознаны по картинке автоматически, описания — дословно из ПДР.</p>`;
  }
  function objInfo(I, ns, num) {
    const key = ns + ":" + num, c = pdrGet(I, key); if (!c) return null;
    return { ns, num, key, chunkKey: c.k, name: I.names[key] || "", def: c.text, notes: I.notes[key] || [] };
  }
  function lawHtml(I, cs) {
    if (!cs.length) return `<p class="law-none">Отдельного пункта ПДР для этого вопроса нет — пояснение ниже по сути.</p>`;
    return `<div class="law-src">Правила дорожнього руху України · ${esc(I.edition.split(" (")[0].toLowerCase())}</div>` + cs.map((c, i) => {
      const long = c.text.length > 700;
      return `<figure class="law-item"><figcaption>${esc(c.label)}</figcaption><blockquote lang="uk" class="${long ? "clamp" : ""}" id="law-${i}">${esc(c.text)}</blockquote>${long ? `<button class="law-more" data-i="${i}">Показать полностью</button>` : ""}</figure>`;
    }).join("");
  }
  function renderWhy(box, I, cs, text, done, objs) {
    objs = objs || [];
    const shown = new Set(objs.map(o => o.chunkKey));
    const law = cs.filter(c => !shown.has(c.k));
    box.innerHTML = `${I && objs.length ? `<div class="law">${objCards(I, objs)}</div>` : ""}<div class="law">${I ? (law.length || !objs.length ? lawHtml(I, law) : "") : ""}</div><div class="why-text">${esc(text)}</div>${done ? note() : ""}`;
    box.querySelectorAll(".law-more").forEach(b => b.onclick = () => {
      if (b.dataset.more != null) { const o = objs[+b.dataset.more]; const ul = b.previousElementSibling; ul.innerHTML = o.notes.map(n => `<li>${esc(n)}</li>`).join(""); b.remove(); return; }
      const bq = box.querySelector("#" + (b.dataset.t || "law-" + b.dataset.i)); if (bq) bq.classList.remove("clamp"); b.remove();
    });
  }
  async function setupWhy(q, chosen) {
    const btn = $("#why"); if (!btn) return;
    const sample = await getSample();
    if (!sample || whyOff || !btn.isConnected) return;
    btn.hidden = false;
    btn.onclick = async () => {
      const box = $("#explain"); box.hidden = false;
      const key = q.id + ":" + chosen;
      if (whyCache.has(key)) { const c = whyCache.get(key); renderWhy(box, c.I, c.cs, c.text, true, c.objs); btn.hidden = true; return; }
      btn.disabled = true;
      const ctl = new AbortController(); whyCtl = ctl;
      const optsTxt = q.o.map((t, i) => (i + 1) + ") " + t).join("\n");
      let I = null, cs = [], img = null, objs = [];
      try {
        box.innerHTML = `<div class="law"><p class="law-none">${q.p >= 0 ? "Распознаю знаки на картинке и ищу пункты ПДР…" : "Ищу пункт ПДР…"}</p></div>`;
        if (q.p >= 0) { const lim = await sample.limits().catch(() => null); const src = lim && lim.images ? await imgSrc(q).catch(() => null) : null; if (src) img = dataUrlToBlob(src); }
        try { I = await loadPdr(); } catch (e) { I = null; }
        // step 1: pick the ПДР fragments (fast model, JSON)
        if (I) {
          const { top, toc } = pdrCandidates(I, q);
          const withObjs = !!img || q.s === "33" || q.s === "34";
          const catalog = withObjs ? `\nКаталог дорожных знаков ПДР Украины (номер и название):\n${I.order["33"].map(n => n + " " + (I.names["33:" + n] || "")).join("\n")}\n\nКаталог дорожной разметки (номер и начало описания):\n${I.order["34"].map(n => { const c = pdrGet(I, "34:" + n); return n + " " + (c ? clip(c.text.replace(/^[\d., і-]+/, "").trim(), 45) : ""); }).join("\n")}\n` : "";
          const pick = `Задача: ${withObjs ? "(1) определить, какие дорожные знаки и какая разметка изображены на иллюстрации к вопросу (или прямо названы в вопросе), и (2) " : ""}выбрать из фрагментов Правил дорожного движения Украины (ПДР) от 1 до 3, которые прямо обосновывают правильный ответ на экзаменационный вопрос.
Верни только JSON вида {${withObjs ? `"signs": ["3.36", "3.37"], "marks": ["1.1"], ` : ""}"keys": ["10.1"]}.${withObjs ? ` В "signs" и "marks" — номера строго из каталогов ниже, только то, что действительно видно на иллюстрации или названо в вопросе (для табличек — номер таблички 7.x); если не уверен в знаке — не включай его; если знаков или разметки нет — пустой список.` : ""} В "keys" — ключи строго из квадратных скобок списка фрагментов${withObjs ? " (описание знака или разметки из каталога можно указать как 33:<номер знака> или 34:<номер разметки>)" : ""}, самый важный первым. Если в ПДР нет прямого обоснования (вопрос про устройство автомобиля, медицину, психологию, юридическую ответственность, европротокол) — "keys": [].
${img ? "К вопросу приложена иллюстрация.\n" : ""}
Вопрос ${q.s}.${q.n} (раздел «${SECT.get(q.s).title}»): ${q.t}
Варианты:
${optsTxt}
Правильный ответ: ${q.c}) ${q.o[q.c - 1]}

Наиболее похожие фрагменты (текст):
${top.map(c => `[${c.k}] ${c.label}: ${clip(c.text, 900)}`).join("\n")}
${toc.length && !(withObjs && (q.s === "33" || q.s === "34")) ? `\nОстальные фрагменты этого раздела ПДР (начало текста):\n${toc.map(c => `[${c.k}] ${c.label}` + (c.k.startsWith("33:") && !c.k.startsWith("33:п") ? "" : `: ${clip(c.text, 110)}`)).join("\n")}` : ""}${catalog}`;
          const o1 = { signal: ctl.signal, modelTier: img ? "default" : "quick" }; if (img) o1.images = [img]; // reading signs off a picture needs the stronger model
          let keys = [], signs = [], marks = [];
          try {
            const r = await sample.json(pick, o1);
            keys = Array.isArray(r && r.keys) ? r.keys : [];
            signs = withObjs && Array.isArray(r && r.signs) ? r.signs : []; marks = withObjs && Array.isArray(r && r.marks) ? r.marks : [];
          } catch (e) { if (e && (e.code === "cancelled" || HIDE_CODES.includes(e.code) || e.code === "rate_limited")) throw e; }
          for (const k of keys.slice(0, 3)) { const c = pdrGet(I, String(k)); if (c && !cs.includes(c)) cs.push(c); }
          const seenNum = new Set();
          for (const [ns, list] of [["33", signs], ["34", marks]]) for (const n of list.slice(0, 8)) {
            const num = String(n).trim().replace(/^(знак|розмітка)\s*/i, ""); if (seenNum.has(ns + num)) continue;
            const o = objInfo(I, ns, num); if (o) { seenNum.add(ns + num); objs.push(o); }
          }
        }
        if (!box.isConnected) return;
        renderWhy(box, I, cs, "Думаю…", false, objs);
        // step 2: explanation grounded in the quoted points (streams)
        const explainPrompt = `Ты — опытный инструктор автошколы в Украине. Ученик проходит тренажёр теоретического экзамена ПДР Украины (вопросы на украинском).
Объясни по-русски, коротко (3–6 предложений), почему правильный ответ — вариант ${q.c}.${chosen !== q.c ? ` Ученик выбрал вариант ${chosen} — кратко скажи, в чём ошибка.` : ""}
${cs.length || objs.length ? "Опирайся на приведённые ниже пункты ПДР и описания знаков и ссылайся на них так, как они подписаны (например, «п. 10.1», «знак 5.34»). Другие номера пунктов не называй." : "Прямого пункта ПДР к вопросу не нашлось — объясни по сути, без номеров пунктов."}
Правильный ответ задан официальной таблицей ответов, не оспаривай его. Без вступлений и заголовков, простым текстом.
${img ? "К вопросу приложена иллюстрация (дорожная ситуация, знак или разметка)." : ""}

Раздел: ${SECT.get(q.s).title}
Вопрос ${q.s}.${q.n}: ${q.t}
Варианты:
${optsTxt}
Правильный ответ: ${q.c}
${objs.length ? "\nЗнаки и разметка на иллюстрации (описания из ПДР, укр.):\n" + objs.map(o => `${o.ns === "33" ? "знак" : "розмітка"} ${o.num}${o.name ? " «" + o.name + "»" : ""}: ${o.def}${o.notes.length ? "\nЗагальні положення: " + o.notes.slice(0, 4).join(" | ") : ""}`).join("\n\n") : ""}
${cs.length ? "\nПункты ПДР (укр.):\n" + cs.map(c => `${c.label}: ${c.text}`).join("\n\n") : ""}`;
        const o2 = { signal: ctl.signal, onText: ({ text }) => { const t = box.querySelector(".why-text"); if (t) t.textContent = text; } };
        if (img) o2.images = [img];
        const { text } = await sample(explainPrompt, o2);
        whyCache.set(key, { I, cs, text, objs });
        if (box.isConnected) { renderWhy(box, I, cs, text, true, objs); btn.hidden = true; }
      } catch (e) {
        if (!box.isConnected) return;
        if (e && e.code === "cancelled") return;
        if (e && HIDE_CODES.includes(e.code)) { whyOff = true; btn.hidden = true; box.hidden = true; return; }
        const msg = (e && e.code === "rate_limited") ? "Слишком много запросов подряд — попробуйте чуть позже." : "Не удалось получить пояснение. Попробуйте ещё раз.";
        const t = box.querySelector(".why-text");
        if (t) t.textContent = (e && e.text ? e.text + "\n\n" : "") + msg; else box.innerHTML = `<div class="why-text">${esc(msg)}</div>`;
      } finally { if (btn.isConnected) btn.disabled = false; if (whyCtl === ctl) whyCtl = null; }
    };
  }
  const note = () => `<span class="note">Цитаты — дословно из официального текста ПДР. Пояснение сгенерировано Claude и может быть неточным.</span>`;

  // ---------- keyboard ----------
  document.addEventListener("keydown", e => {
    if (!session || session.done || e.metaKey || e.ctrlKey || e.altKey) return;
    if (session.paused) { if (e.key === "Enter" && !(e.target && e.target.id === "home")) { e.preventDefault(); continueSession(); } return; }
    if (e.key === "Escape") { e.preventDefault(); return pauseSession(); }
    const S = session, vi = S.view == null ? S.idx : S.view;
    if (isReal(S)) {
      if (e.key === "ArrowLeft" && vi > 0) { e.preventDefault(); return goTo(vi - 1); }
      if (e.key === "ArrowRight" && vi < S.ids.length - 1) { e.preventDefault(); return goTo(vi + 1); }
    }
    if (S.mode === "exam" && e.key === "ArrowLeft" && vi > 0) { e.preventDefault(); return goTo(vi - 1); }
    if (S.mode === "exam" && e.key === "ArrowRight" && vi < S.idx) { e.preventDefault(); return goTo(vi + 1); }
    if (vi !== S.idx) { if (e.key === "Enter" && !(e.target && (e.target.id === "why" || e.target.id === "rv-prev" || e.target.id === "rv-next"))) { e.preventDefault(); goTo(S.idx); } return; }
    const id = session.ids[session.idx], q = BY.get(id);
    if (!session.ans[id] && /^[1-5]$/.test(e.key) && +e.key <= q.o.length) { e.preventDefault(); answer(+e.key); }
    else if (session.ans[id] && e.key === "Enter" && !(e.target && (e.target.id === "why" || e.target.id === "pause" || e.target.id === "quit"))) { e.preventDefault(); next(); }
  });

  // ---------- auto-pause when the page is left (tab switch, app switch, close) ----------
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") pauseSession(); });
  window.addEventListener("pagehide", () => pauseSession());

  // ---------- boot ----------
  function start(data) {
    const hs = data && data.session;
    if (hs && !hs.done && Array.isArray(hs.ids) && hs.ids.every(id => BY.has(id))) {
      session = hs;
      if (session.paused) renderPaused();
      else { if (isExam(session)) startTimer(); renderQuestion(); }
    } else {
      const loc = readLocalSnap(); saved = validSnap(loc) ? loc : null;
      renderHome();
    }
    setSaveState(); renderProgress();
    initStore();
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === "function") { try { hot.snapshot(() => ({ session })); } catch (e) {} }
  if (hot && typeof hot.ready === "function") { try { hot.ready(start); } catch (e) { start({}); } }
  else start((hot && hot.data) || {});
})();
</script>
